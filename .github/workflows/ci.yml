name: integrity

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python PIPELINES/ontology/validate_ontology.py
      # Collection first, and on its own. pytest exits 2 for a collection error just
      # as it does for an interrupt, so a failure here has been indistinguishable from
      # a failure there -- and the import that actually broke scrolls past inside a
      # run that reports only "exit code 2". Splitting it means the next failure names
      # the module it could not import instead of needing the raw log to find out.
      - name: Collect tests (import check)
        run: |
          set +e
          output=$(python -m pytest TESTS --collect-only -q 2>&1)
          status=$?
          if [ $status -ne 0 ]; then
            # Raise the failure as annotations. The job log needs repository admin to
            # download, so a collection error that only reaches stdout is invisible to
            # anyone without it -- which is how "exit code 2" stayed undiagnosed. The
            # workflow-command form is readable through the public checks API.
            echo "$output" | tail -n 40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $status
          fi
          echo "$output" | tail -n 2
      - name: Run tests
        run: python -m pytest TESTS -q
      - run: npm run test:ui
      - run: npm run build:launch
