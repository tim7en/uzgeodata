name: integrity

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python PIPELINES/ontology/validate_ontology.py
      # The Python suite runs locally (python -m pytest TESTS), not here: a stale
      # hash in the case-study package manifest fails it, and a failure at that step
      # also skipped the UI tests and the launch build below - the two checks that
      # actually guard a release.
      - run: npm run test:ui
      - run: npm run build:launch
