<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="1180" height="640" fill="#fdfdfc"/><text x="24" y="40" font-size="19" font-weight="650" fill="#1a202c">What the corrections do to "significant"</text><text x="24" y="63" font-size="12.5" fill="#4a5568">Basins called significant at α=0.05, of 7,445 tested, for each of the nine variables in the record. Left to right: no correction, corrected for serial persistence, then controlled for false discovery across all basins.</text><text x="24" y="84" font-size="12.5" fill="#9b2c2c">For four of the nine variables the third bar is zero.</text><rect x="250" y="100" width="20" height="10" rx="2" fill="#cbd5e0"/><text x="276" y="109" font-size="11.5" fill="#1a202c">uncorrected</text><rect x="358.6" y="100" width="20" height="10" rx="2" fill="#90a6c4"/><text x="384.6" y="109" font-size="11.5" fill="#1a202c">serial correlation corrected</text><rect x="579.4" y="100" width="20" height="10" rx="2" fill="#1b4d7e"/><text x="605.4" y="109" font-size="11.5" fill="#1a202c">false discovery controlled</text><text x="238" y="152" text-anchor="end" font-size="13" fill="#1a202c">aet</text><rect x="250" y="136.0" width="157.4" height="9" rx="2" fill="#cbd5e0"><title>aet: 815 basins</title></rect><rect x="250" y="147.0" width="155.7" height="9" rx="2" fill="#90a6c4"><title>aet: 806 basins</title></rect><rect x="250" y="158.0" width="9.7" height="9" rx="2" fill="#1b4d7e"><title>aet: 50 basins</title></rect><text x="1156" y="156" text-anchor="end" font-size="12.5" fill="#1a202c">815 → <tspan font-weight="650">50</tspan></text><text x="238" y="198" text-anchor="end" font-size="13" fill="#1a202c">pet</text><rect x="250" y="182.0" width="300.7" height="9" rx="2" fill="#cbd5e0"><title>pet: 1,557 basins</title></rect><rect x="250" y="193.0" width="299.8" height="9" rx="2" fill="#90a6c4"><title>pet: 1,552 basins</title></rect><rect x="250" y="204.0" width="0.0