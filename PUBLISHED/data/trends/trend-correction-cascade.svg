x="2" fill="#cbd5e0"><title>tmx: 2,844 basins</title></rect><rect x="250" y="515.0" width="501.4" height="9" rx="2" fill="#90a6c4"><title>tmx: 2,596 basins</title></rect><rect x="250" y="526.0" width="0.0" height="9" rx="2" fill="#1b4d7e"><title>tmx: 0 basins</title></rect><text x="256" y="534.0" font-size="10.5" fill="#9b2c2c">none</text><text x="1156" y="524" text-anchor="end" font-size="12.5" fill="#9b2c2c">2,844 → <tspan font-weight="650">0</tspan></text><text x="24" y="606" font-size="11.5" fill="#4a5568">Precipitation is the clearest case: its smallest p-value across all 7,445 basins is 0.011, which clears no step-up threshold anywhere.</text><text x="24" y="624" font-size="11.5" fill="#4a5568">Soil moisture is a modelled quantity, not an observation — see the caveat in the study text before reading it as drying.</text></svg>