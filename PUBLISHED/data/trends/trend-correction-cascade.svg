<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="1180" height="640" fill="#fdfdfc"/><text x="24" y="40" font-size="19" font-weight="650" fill="#1a202c">What the corrections do to "significant"</text><text x="24" y="63" font-size="12.5" fill="#4a5568">Basins called significant at α=0.05, of 7,445 tested, for each of the nine variables in the record. Left to right: no correction, corrected for serial persistence, then controlled for false discovery across all basins.</text><text x="24" y="84" font-size="12.5" fill="#9b2c2c">For four of the nine variables the third bar is zero.</text><rect x="250" y="100" width="20" height="10" rx="2" fill="#cbd5e0"/><text x="276" y="109" font-size="11.5" fill="#1a202c">uncorrected</text><rect x="358.6" y="100" width="20" height="10" rx="2" fill="#90a6c4"/><text x="384.6" y="109" font-size="11.5" fill="#1a202c">serial correlation corrected</text><rect x="579.4" y="100" width="20" height="10" rx="2" fill="#1b4d7e"/><text x="605.4" y="109" font-size="11.5" fill="#1a202c">false discovery controlled</text><text x="238" y="152" text-anchor="end" font-size="13" fill="#1a202c">aet</text><rect x="250" y="136.0" width="138.7" height="9" rx="2" fill="#cbd5e0"><title>aet: 911 basins</title></rect><rect x="250" y="147.0" width="136.8" height="9" rx="2" fill="#90a6c4"><title>aet: 899 basins</title></rect><rect x="250" y="158.0" width="4.7" height="9" rx="2" fill="#1b4d7e"><title>aet: 31 basins</title></rect><text x="1156" y="156" text-anchor="end" font-size="12.5" fill="#1a202c">911 → <tspan font-weight="650">31</tspan></text><text x="238" y="198" text-anchor="end" font-size="13" fill="#1a202c">pet</text><rect x="250" y="182.0" width="302.0" height="9" rx="2" fill="#cbd5e0"><title>pet: 1,984 basins</title></rect><rect x="250" y="193.0" width="301.1" height="9" rx="2" fill="#90a6c4"><title>pet: 1,978 basins</title></rect><rect x="250" y="204.0" width="0.0" height="9" rx="2" fill="#1b4d7e"><title>pet: 0 basins</title></rect><text x="256" y="212.0" font-size="10.5" fill="#9b2c2c">none</text><text x="1156" y="202" text-anchor="end" font-size="12.5" fill="#9b2c2c">1,984 → <tspan font-weight="650">0</tspan></text><text x="238" y="244" text-anchor="end" font-size="13" fill="#1a202c">pre</text><rect x="250" y="228.0" width="43.1" height="9" rx="2" fill="#cbd5e0"><title>pre: 283 basins</title></rect><rect x="250" y="239.0" width="42.2" height="9" rx="2" fill="#90a6c4"><title>pre: 277 basins</title></rect><rect x="250" y="250.0" width="0.0" height="9" rx="2" fill="#1b4d7e"><title>pre: 0 basins</title></rect><text x="256" y="258.0" font-size="10.5" fill="#9b2c2c">none</text><text x="1156" y="248" text-anchor="end" font-size="12.5" fill="#9b2c2c">283 → <tspan font-weight="650">0</tspan></text><text x="238" y="290" text-anchor="end" font-size="13" fill="#1a202c">run</text><rect x="250" y="274.0" width="246.4" height="9" rx="2" fill="#cbd5e0"><title>run: 1,619 basins</title></rect><rect x="250" y="285.0" width="240.3" height="9" rx="2" fill="#90a6c4"><title>run: 1,579 basins</title></rect><rect x="250" y="296.0" width="13.2" height="9" rx="2" fill="#1b4d7e"><title>run: 87 basins</title></rect><text x="1156" y="294" text-anchor="end" font-size="12.5" fill="#1a202c">1,619 → <tspan font-weight="650">87</tspan></text><text x="238" y="336" text-anchor="end" font-size="13" fill="#1a202c">snw</text><rect x="250" y="320.0" width="186.6" height="9" rx="2" fill="#cbd5e0"><title>snw: 1,226 basins</title></rect><rect x="250" y="331.0" width="182.9" height="9" rx="2" fill="#90a6c4"><title>snw: 1,202 basins</title></rect><rect x="250" y="342.0" width="5.9" height="9" rx="2" fill="#1b4d7e"><title>snw: 39 basins</title></rect><text x="1156" y="340" text-anchor="end" font-size="12.5" fill="#1a202c">1,226 → <tspan font-weight="650">39</tspan></text><text x="238" y="382" text-anchor="end" font-size="13" fill="#1a202c">soil</text><rect x="250" y="366.0" width="670.0" height="9" rx="2" fill="#cbd5e0"><title>soil: 4,402 basins</title></rect><rect x="250" y="377.0" width="663.9" height="9" rx="2" fill="#90a6c4"><title>soil: 4,362 basins</title></rect><rect x="250" y="388.0" width="557.8" height="9" rx="2" fill="#1b4d7e"><title>soil: 3,665 basins</title></rect><text x="1156" y="386" text-anchor="end" font-size="12.5" fill="#1a202c">4,402 → <tspan font-weight="650">3,665</tspan></text><text x="238" y="428" text-anchor="end" font-size="13" fill="#1a202c">tmn</text><rect x="250" y="412.0" width="470.8" height="9" rx="2" fill="#cbd5e0"><title>tmn: 3,093 basins</title></rect><rect x="250" y="423.0" width="469.9" height="9" rx="2" fill="#90a6c4"><title>tmn: 3,087 basins</title></rect><rect x="250" y="434.0" width="311.0" height="9" rx="2" fill="#1b4d7e"><title>tmn: 2,043 basins</title></rect><text x="1156" y="432" text-anchor="end" font-size="12.5" fill="#1a202c">3,093 → <tspan font-weight="650">2,043</tspan></text><text x="238" y="474" text-anchor="end" font-size="13" fill="#1a202c">tmp</text><rect x="250" y="458.0" width="370.2" height="9" rx="2" fill="#cbd5e0"><title>tmp: 2,432 basins</title></rect><rect x="250" y="469.0" width="356.0" height="9" rx="2" fill="#90a6c4"><title>tmp: 2,339 basins</title></rect><rect x="250" y="480.0" width="0.0" height="9" rx="2" fill="#1b4d7e"><title>tmp: 0 basins</title></rect><text x="256" y="488.0" font-size="10.5" fill="#9b2c2c">none</text><text x="1156" y="478" text-anchor="end" font-size="12.5" fill="#9b2c2c">2,432 → <tspan font-weight="650">0</tspan></text><text x="238" y="520" text-anchor="end" font-size="13" fill="#1a202c">tmx</text><rect x="250" y="504.0" width="541.1" height="9" rx="2" fill="#cbd5e0"><title>tmx: 3,555 basins</title></rect><rect x="250" y="515.0" width="493.3" height="9" rx="2" fill="#90a6c4"><title>tmx: 3,241 basins</title></rect><rect x="250" y="526.0" width="0.0" height="9" rx="2" fill="#1b4d7e"><title>tmx: 0 basins</title></rect><text x="256" y="534.0" font-size="10.5" fill="#9b2c2c">none</text><text x="1156" y="524" text-anchor="end" font-size="12.5" fill="#9b2c2c">3,555 → <tspan font-weight="650">0</tspan></text><text x="24" y="606" font-size="11.5" fill="#4a5568">Precipitation is the clearest case: its smallest p-value across all 7,445 basins is 0.011, which clears no step-up threshold anywhere.</text><text x="24" y="624" font-size="11.5" fill="#4a5568">Soil moisture is a modelled quantity, not an observation — see the caveat in the study text before reading it as drying.</text></svg>